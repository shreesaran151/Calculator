<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cosmic Calculator</title>
  <link rel="stylesheet" href="cal.css">
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Cosmic Calculator</h1>
      <p>Calculate among the stars — a neat, glassy calculator UI with friendly neon accents. Supports basic operations, percent and +/- toggle. Use mouse or keyboard.</p>
    </div>

    <div class="calculator" role="application" aria-label="Cosmic Calculator">
      <div id="display" class="display" aria-live="polite">0</div>

      <div class="keys" id="keys">
        <!-- top row -->
        <button class="key control" data-action="clear">C</button>
        <button class="key control" data-action="toggle-sign">+/-</button>
        <button class="key control" data-action="percent">%</button>
        <button class="key op" data-action="operator" data-value="/">÷</button>

        <!-- numbers -->
        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key op" data-action="operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key op" data-action="operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key op" data-action="operator" data-value="+">+</button>

        <button class="key zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
    </div>
  </div>
  <script src="cal.js"></script>
</body>
</html>
